# 给"没有 .env、只能在图形界面里点"的机器：飞牛 FNOS、群晖 Container Manager、1Panel 的
# Compose 项目都可以直接把这一本贴进去。与 docker-compose.yml 的分工：
#   · docker-compose.yml —— 有 .env、有 Caddy 反代的生产拓扑（对外只暴露 80/443）。
#   · 本文件 —— 一台 NAS、一个 MySQL、局域网里手机直连 7404 的自用拓扑。
#
# 服务端不读环境变量，所以这本文件里**一个变量都没有**：库地址、库口令、要不要对象存储、
# 加密口令、管理台口令，全都在首次启动弹出的安装页里填。up 之后浏览器打开
#   http://<NAS_IP>:7404/
# 看到的就是安装页，填完点「保存并启动」，同一个容器接着起服务，不用重启也不用回来改这个文件。
#
# 两条铁律：
#   1) 本文件刻意不使用任何 ${VAR} 插值。图形界面里没有文件可编辑，解析阶段的
#      "required variable ... is missing a value" 既读不懂也改不动——那正是 2026-10-22 有人
#      在飞牛上撞到的那条。现在连必填项都挪进安装页了，这一条只是留给下面那段可选的 mysql。
#   2) 走「创建容器」表单（不用本文件）时同样成立：镜像声明了 VOLUME /app/data，表单里会自动
#      出现这一行，宿主文件夹仍需自己选。要填的东西在安装页里，不在表单里。

name: pushbox-nas

services:
  pushbox:
    # Hub 上是 <主.次.补丁>（如 1.1.5）/ <主.次>（1.1）/ latest 三种写法，指向同一个镜像；版本号由
    # 发布工作流从 pom.xml 现读，不带 git 标签里的 v 或 server-v 前缀——v1.2.0、server-v1.2.0 在 Hub 上都不存在。
    # 想用自己现场出的镜像（ARM 机型，或不想等发版），把下面这行换成 pushbox:local：
    #   docker build -f deploy/Dockerfile -t pushbox:local .
    image: docker.io/iamplusdev/push-box:latest
    ports:
      # 局域网内手机/PC 直连这个端口就够（注册时填 http://<NAS_IP>:7404）。安装页也在这里。
      # 要暴露到公网就得自己上 HTTPS 反代：明文链路上跑的是消息正文与管理台口令。
      - "7404:7404"
    volumes:
      # 一个卷装下全部可变状态：config/pushbox.json（安装页写的配置）、media/（图片与头像）、logs/。
      # 图形界面里的「存储位置」就是这一行：容器里的地址不变，宿主侧由 named volume 兜着。
      # 想直接落到自己在 NAS 上建的文件夹（方便备份），就换成绑定挂载，并先把目录交给 uid 10001：
      #   - /vol1/1000/pushbox:/app/data        # 换成你那台 NAS 上的真实路径
      #   sudo chown -R 10001:10001 /vol1/1000/pushbox
      # 不 chown 就用绑定挂载的话，容器起 1 秒就退，entrypoint 会点名"数据目录不可写"并给出这两种修法。
      # 一行都不挂也起得来，但配置与图片落进容器可写层，docker rm 之后全没——包括安装页填的那些值。
      # NAS 界面可能把 named volume 显示成空（因为它们不在某个共享文件夹里），那是正常的；路径用
      #   docker volume inspect pushbox-nas_pushbox_data -f '{{.Mountpoint}}'
      # 查。
      - pushbox_data:/app/data
    healthcheck:
      # 只做 TCP 探活：`/healthz` 会真连库，用业务探活做 healthcheck 等于让一次数据库抖动就把容器判死；
      # 而且没配置完时容器停在安装页上，那会儿 /healthz 根本不存在，但 7404 已经有人监听。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7404"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  # ---- 想在同一个项目里顺带起一个 MySQL（NAS 上还没有库时）----
  # 取消注释后，安装页里的「数据库地址」填服务名 mysql，「密码」填这里的 MYSQL_PASSWORD 同一个值
  # （compose 没法在一个文件里引用自己写过的值，两处同值是这套写法的代价）。
  # 首启 Flyway 要建九张表，慢个几十秒是正常的；安装页的「测试连接」会当场告诉你通不通，
  # 连不上就一个字节都不写，改完再点一次即可。
  #
  # mysql:
  #   image: docker.io/library/mysql:8.4
  #   # ngram_token_size=2 是中文全文搜索的前提（V1 迁移里的 FULLTEXT ... WITH PARSER ngram）。
  #   command: --ngram_token_size=2
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 另一个强口令
  #     MYSQL_DATABASE: pushbox
  #     MYSQL_USER: pushbox
  #     MYSQL_PASSWORD: 把库口令填在这里
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   restart: unless-stopped
  #
  # 不发布 3306 端口是刻意的：pushbox 容器与它在同一个默认网络上，按服务名就能连，
  # 而把一个能读写 pushbox 库的端口摆到局域网里没有任何收益。
  # 空库首次初始化在 NAS 上普遍要 1～2 分钟：这期间安装页的「测试连接」会报连不上，
  # 用 docker logs <mysql 容器名> --tail 20 看它到哪一步了，起好再回来点一次。

volumes:
  pushbox_data: {}
  # 用了上面那段 mysql 才需要：
  # db_data: {}
