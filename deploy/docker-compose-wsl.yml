# WSL Docker 测试环境配置 - 完整独立部署（拓扑 B）
# 包含 MySQL + RustFS + PushBox Server + Caddy

name: pushbox-test

services:
  pushbox-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pushbox/server:1.1.2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 与主文件同口径（D76）：一项 :? 都没有，必填判据在容器 entrypoint 里。
      # 库地址两种写法：只给 PB_DB_HOST（镜像默认 mysql），或给完整 PB_DB_URL（两者都给时 URL 赢）。
      PB_DB_URL: ${PB_DB_URL:-}
      PB_DB_HOST: ${PB_DB_HOST:-mysql}
      PB_DB_PORT: ${PB_DB_PORT:-3306}
      PB_DB_NAME: ${PB_DB_NAME:-pushbox}
      PB_DB_USERNAME: ${PB_DB_USERNAME:-pushbox}
      PB_DB_PASSWORD: ${PB_DB_PASSWORD:-}
      # 与主文件同口径：这三项用 :-（可空）而不是 :?（必填）。PB_STORAGE_TYPE=local 时它们本来就不该有值，
      # 而必填会把"顺手起一个不带 RustFS 的测试栈"这条路堵死；真走 s3 时缺值由 S3Config 与镜像入口脚本点名拒绝启动。
      PB_S3_ENDPOINT: ${PB_S3_ENDPOINT:-}
      PB_S3_REGION: ${PB_S3_REGION:-us-east-1}
      PB_S3_BUCKET: ${PB_S3_BUCKET:-pushbox}
      PB_S3_ACCESS_KEY: ${PB_S3_ACCESS_KEY:-}
      PB_S3_SECRET_KEY: ${PB_S3_SECRET_KEY:-}
      PB_S3_PATH_STYLE: ${PB_S3_PATH_STYLE:-true}
      # 与主文件同步：prod profile 只认这两个键名，缺映射时 PB_STORAGE_TYPE=local 是个死开关。
      PB_STORAGE_TYPE: ${PB_STORAGE_TYPE:-s3}
      PB_STORAGE_LOCAL_PATH: ${PB_STORAGE_LOCAL_PATH:-/app/data/media}
      PB_S3_OBJECT_ENCRYPT: ${PB_S3_OBJECT_ENCRYPT:-none}
      PB_S3_MASTER_KEY: ${PB_S3_MASTER_KEY:-}
      PB_ALLOW_PLAINTEXT_MEDIA: ${PB_ALLOW_PLAINTEXT_MEDIA:-}
      # 与主文件同口径：留空 = 管理台禁用（一个安全状态），要开就得两把钥都配；
      # 只配一把、两把同值、短于下限都由 entrypoint 在启动 Java 之前点名拒绝。
      PB_ADMIN_SECRET: ${PB_ADMIN_SECRET:-}
      PB_ADMIN_JWT_SECRET: ${PB_ADMIN_JWT_SECRET:-}
      # 默认留空（只放行环回），跟主文件一个口径。测试机要宿主/模拟器直连 /healthz 与 /actuator，
      # 靠 wsl-test.env 里那行显式的 172.16.0.0/12,127.0.0.0/8 放行；写进 compose 默认值的话，
      # 谁照着这份文件抄一个生产栈就顺手把整段私有网段放进去了。
      PB_SECURITY_INTERNAL_CIDRS: ${PB_SECURITY_INTERNAL_CIDRS:-}
      PB_LOG_DIR: /app/logs
      # 与主文件同步：端口映射、healthcheck、Caddy 上游三处都读 PB_SERVER_PORT，进程也得读，
      # 否则改端口只会得到"容器起了但没人监听那个口"。
      PB_SERVER_PORT: ${PB_SERVER_PORT:-7404}
    volumes:
      - server_logs:/app/logs
      # 与主文件刻意不同：这里保留宿主绑定挂载 ./data/media，因为 deploy-wsl.sh / deploy-wsl.ps1 的
      # reset 就是按目录 rm 的，换成 named volume 会把"清测试数据"变成还要 docker volume rm。
      # 代价是本地拓扑在这套栈上要先让目录归 uid 10001（宿主目录属主跟着 host 走），否则
      # entrypoint 的写入探针会拒绝启动——那是主文件推荐的挂法，测试栈图省事所以留旧写法。
      - ./data/media:/app/data/media
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${PB_SERVER_PORT:-7404}"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    restart: unless-stopped
    ports:
      - "${PB_SERVER_PORT:-7404}:${PB_SERVER_PORT:-7404}"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - pushbox-net

  caddy:
    image: caddy:2
    environment:
      PB_CADDY_HOST: ${PB_CADDY_HOST:-localhost}
      PB_SERVER_PORT: ${PB_SERVER_PORT:-7404}
    ports:
      - "${PB_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pushbox-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pushbox-net

  # MySQL 数据库
  mysql:
    image: mysql:8.4
    command: --ngram_token_size=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      MYSQL_DATABASE: pushbox
      MYSQL_USER: pushbox
      MYSQL_PASSWORD: ${PB_DB_PASSWORD:?PB_DB_PASSWORD 未设置}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pushbox", "-p${PB_DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    networks:
      - pushbox-net

  # RustFS 对象存储
  # 镜像监听 9000（S3 API）/ 9001（Console），所以 wsl-test.env 里 PB_S3_ENDPOINT=http://rustfs:9000。
  # 这里曾经写成 7101（那是远端存储机上那台实例的端口，不是镜像默认值）：因为 /healthz 的 storage
  # 只判"配置非空"，错端口一路显示 up，直到第一条带图的消息才暴露。
  # 桶不会自动创建，首次部署补一次（rustfs 镜像里没有 S3 客户端；`minio/mc` 已从 Docker Hub 下架，实测 404）。
  # 这份 compose 不给 rustfs 发布端口，所以客户端要借 rustfs 自己的网络命名空间才够得着 127.0.0.1:9000：
  #   docker run --rm --network container:"$(docker compose -f deploy/docker-compose-wsl.yml ps -q rustfs)" \
  #     -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION=us-east-1 \
  #     amazon/aws-cli --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket pushbox
  #   有 mc 的话同理：mc alias set pb http://127.0.0.1:9000 $PB_S3_ACCESS_KEY $PB_S3_SECRET_KEY && mc mb pb/pushbox
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${PB_S3_ACCESS_KEY:?PB_S3_ACCESS_KEY 未设置}
      RUSTFS_SECRET_KEY: ${PB_S3_SECRET_KEY:?PB_S3_SECRET_KEY 未设置}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    networks:
      - pushbox-net

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - pushbox-net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 未设置}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - pushbox-net

volumes:
  caddy_data: {}
  caddy_config: {}
  server_logs: {}
  mysql_data: {}
  rustfs_data: {}

networks:
  pushbox-net:
    driver: bridge
