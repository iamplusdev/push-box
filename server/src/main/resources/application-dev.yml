# §11.1 当前联调配置（D23）：MySQL 在本机 127.0.0.1，服务端本机直跑、不进容器；存储默认本地文件，要验桶形态显式给 PB_STORAGE_TYPE=s3。
# 凭据只从环境变量读取，任何情况下都不要把明文写进本文件（本文件会入库）。
#
# 端口不在这里出现：dev 继承 base application.yml 的 7404，与 prod 的 ${PB_SERVER_PORT:7404} 同一个默认值，
# 所以本机实例、adb reverse、客户端里填的地址和文档里的 curl 示例都是 7404，只有一个端口要记。
# 要另起一个不干扰手动实例的（PC 真服务体检、并发探针）就传 --server.port=8081，别改这个文件。
spring:
  datasource:
    # 同机库是验收①"1s 内出通知"的判分前提：远端库（同网段另一台机上的 3306）实测单条 SQL 就要 362ms，
    # 入站受理的串行往返必然吃掉整个 1s 预算，那属于链路拓扑而非软件缺陷（见 §11.1.1）。
    # 要切回远端只改这一行 URL，同时把下面被删掉的 connection-test-query 加回来。
    url: jdbc:mysql://127.0.0.1:3306/pushbox?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: pushbox
    # 没有默认值是有意的：忘了 source deploy/env/local.env 就该启动失败，而不是拿一个空口令去连库、
    # 把配置问题伪装成 "Access denied"。这条现在由 DevCredentialsGuard 真的执行（在 DataSource 建起来之前停住，
    # 点名缺哪几个键）——IDEA 自动生成的运行配置不带 env，就是靠这条撞出来的。
    password: ${PB_DB_PASSWORD}
    hikari:
      # 本机链路没有"空闲 26–33s 被中继设备 RST"的问题，所以不配探测语句：
      # 配了会给每条业务语句白加一个来回，正是要避免的那类"用配置掩盖拓扑问题"。
      keepalive-time: 20000
      max-lifetime: 900000

pb:
  # §11.1 本机联调默认走本地文件存储：只装一个 MySQL 就能把服务端跑起来，不必先立一套 RustFS/MinIO。
  # 图片链路照常可用，对象落在 local-path 下。要验真正的 S3 形态就显式给 PB_STORAGE_TYPE=s3
  # （那时 PB_S3_* 三件套重新变成必填，DevCredentialsGuard 会点名）。
  storage:
    type: ${PB_STORAGE_TYPE:local}
    local-path: ${PB_STORAGE_LOCAL_PATH:./data/media}
  s3:
    # 存储机地址同样只从环境读：本文件会入库，写死任何真实地址等于把拓扑公开。
    # 给空串兜底而不是裸占位符：type=local 时这几项根本没有读者，让未解析的 `${PB_S3_ENDPOINT}`
    # 原样留在属性里只会把"没配"伪装成一个非法地址（S3Config 的 require 认空串，不认字面量）。
    endpoint: ${PB_S3_ENDPOINT:}
    region: us-east-1
    bucket: ${PB_S3_BUCKET:pushbox}
    access-key: ${PB_S3_ACCESS_KEY:}
    secret-key: ${PB_S3_SECRET_KEY:}
    path-style: true
    delete-grace: 168h
    # 宽限期巡检节奏（§4.5 media sweep）：tombstone 只把对象标成待删，过 delete-grace 才真删。
    # 要现场看真删：--pb.s3.delete-grace=2s --pb.s3.purge-interval=5s（探针 ⑯ 就是这么跑的）
    purge-initial-delay: 60s
    purge-interval: 1h
    # §4.5 桶内形态。开 sse-c 时 KEK 二选一：
    #   1) PB_S3_MASTER_KEY        —— 稳定的 base64 32 字节（openssl rand -base64 32）；
    #   2) PB_S3_MASTER_PASSPHRASE —— 至少 12 个字符的口令，Argon2id 派生，盐/KCV 存 app_state。
    # 两者都配或都没有时服务端直接拒绝启动，不会静默写明文；KEK 一旦用过就不能换。
    # 切换只影响新写入的对象：历史对象按各自 media_objects/senders 的 enc_mode 读，仍是明文。
    object-encrypt: none
    master-key: ${PB_S3_MASTER_KEY:}
    master-passphrase: ${PB_S3_MASTER_PASSPHRASE:}
  media:
    enabled: true
    max-images: 4
    max-image-bytes: 10485760
    max-total-bytes: 33554432
    timeout: 10s
    max-redirects: 2
    allow-private: false
    allow-hosts: []
    concurrency: 4
    retry-max: 3
    thumb-long-edge: 512
  admin:
    # Web 管理台登录密钥：dev 兜底用一个写在仓库里的弱口令，只为本地能登进去。
    # 别把 dev profile 挂到任何能连外的机器上；生产走 PB_ADMIN_SECRET，compose 与入口脚本都要求强随机。
    secret: ${PB_ADMIN_SECRET:dev-admin-123456}
    # JWT 签名钥：与上面的登录口令分开配，才能在联调里也照样各自轮换。
    # 这个值只属于 dev（本文件会入库），生产走 PB_ADMIN_JWT_SECRET，绝不能复用这一行。
    jwt-secret: dev-admin-jwt-signing-key-not-for-production-0123456789
