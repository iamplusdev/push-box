# §11.2 生产部署。服务端**不读任何环境变量**：库地址与口令、对象存储、加密口令、管理台口令、
# 监听端口，全都在首次启动弹出的安装页里填，落进容器内 /app/data/config/pushbox.json，
# 启动后服务端自己再抄一份进库（app_state.runtime_config_v1，用于「从数据库找回上次配置」）。
# 于是这本文件里 pushbox-server 那一段只剩三件事：镜像、一个卷、一条端口映射。
#
# 首次 up 之后，浏览器打开 http://<反代的域名>/ 或 http://127.0.0.1:7404/，看到的就是安装页；
# 填完点「保存并启动」，同一个容器接着起服务——不用重启、不用重建、不用回来改这个文件。
# 想重走一遍安装：删掉卷里的 config/pushbox.json（docker compose exec pushbox-server rm ...），
# 或在安装页里用「从数据库找回上次配置」把上次的值捞回来改。
#
# 拓扑仍然三选一，区别只在安装页里怎么填，本文件一个字都不用改：
#   A. 复用外部已有的 MySQL / 对象存储 —— 库地址填那台机器的地址（⚠ 不是 127.0.0.1，容器里的环回
#      是它自己）；对象存储勾上并填 http://<S3_HOST>:7101 之类。本文件只起 pushbox-server + caddy。
#   B. 完全独立部署 —— 取消下方 mysql / rustfs 两段注释，安装页里库地址填服务名 mysql、
#      对象存储填 http://rustfs:9000（rustfs/rustfs:latest 监听 9000(S3)/9001(Console)，
#      而拓扑 A 那台在跑的实例挂在 7101；填错端口不会立刻报错，要到第一条带图的消息才炸）。
#      桶 pushbox 不会自动出现，需要建一次：mc mb local/pushbox，没有 mc 时用
#      aws s3api create-bucket --bucket pushbox（两种命令都写在 infra/部署快速参考.md「桶要建一次」）。
#   C. 不接对象存储 —— 安装页里不勾「改用对象存储」，图片与头像落在同一个卷的 media/ 下。
#
# 监控栈（prometheus + grafana）单独一本文件，想要监控时才多传一个 -f：
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# 为什么不留在本文件里挂 profile：见 docker-compose.monitoring.yml 顶部说明。
#
# 还在用环境变量的只有第三方镜像（mysql / rustfs / grafana）——那是它们自己的口径，
# 取值从 .env 来（见 infra/env/prod.env.example），禁止写进本文件、禁止提交。

name: pushbox

services:
  pushbox-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # 引用 CI 推到 Docker Hub 的那个名字，本文件同时留 build: 段：镜像在远端存在就拉，
    # 拉不到（自己 fork、离线、改了代码）才本地编。
    image: docker.io/iamplusdev/push-box:1.1.4
    volumes:
      # 一个卷装下全部可变状态：config/pushbox.json（安装页写的配置）、media/（本地拓扑的图片与头像）、
      # logs/（logback 的滚动文件）。收敛成一个的理由是"人只需要管一处"：NAS 图形界面里的「存储位置」
      # 只有一行要选，备份脚本只指一个目录，chown 只 chown 一次。
      # 必须是 named volume：镜像里 /app/data 属 pushbox(10001)，而 Docker 新建的宿主目录属 root，
      # 用 ./data:/app/data 绑定挂载会把那个属主带进来，进程就写不进配置、图片与日志了
      # （症状是容器起来 1 秒就退，entrypoint 的写入探针会点名这件事并给出两种修法）。
      # 想直接落在看得见的路径上（方便备份）就换成绑定挂载，但先把宿主目录交给 10001：
      #   sudo mkdir -p ./data && sudo chown -R 10001:10001 ./data
      - pushbox_data:/app/data
    healthcheck:
      # 只做 TCP 探活，两条理由：
      #   1) `/healthz` 会真连库，用业务探活做 healthcheck 等于让一次数据库抖动就把容器判死；
      #   2) 没配置完的容器停在安装页上，那时 /healthz 根本不存在，但 7404 已经有人监听——
      #      TCP 探活对"安装中"和"已就绪"给出同一个答案，Caddy 的 depends_on 才不会被卡住。
      # 别把这条改回 curl 的理由找错了——镜像里确实有 curl（eclipse-temurin:21-jre 自带），
      # 选 TCP 是因为判据不同，不是因为缺工具。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7404"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    restart: unless-stopped
    # 业务流量只经 Caddy：反代在同网桥按服务名访问 pushbox-server:7404，公网侧看不到 7404。
    # 7404 绑在宿主环回上是"只给这台机器留一条直连调试口子"，它同时也是没配反代时打开安装页的入口。
    # 注意它并**不**让 /healthz 变可读：经过端口映射的连接在容器里看到的源地址是网桥网关（172.x.0.1），
    # 不是 127.0.0.1，InternalAccessFilter 照样回 404。要从宿主读 /healthz 只有两条路：exec 进容器用
    # /dev/tcp 或 curl，或在安装页的「运维网段」里填这套网络实际分到的子网
    # （判据与命令见 infra/部署快速参考.md「验收」）。
    # 端口写死 7404：它是安装页里的默认值，容器内改端口要同步改这里的映射与 Caddyfile 的上游，
    # 三处一起动才不出"容器起了但没人监听映射端口"的怪事——所以文档口径是"容器里别改，要改改宿主映射"。
    # 需要"手机直连明文 7404"调试时再放开下面那行，代价很清楚：明文链路 + 绕过 Caddy 的
    # /actuator 屏蔽与请求体上限，用完记得注释回去。
    ports:
      - "127.0.0.1:7404:7404"
      # - "7404:7404"

  caddy:
    image: caddy:2
    # 站点地址读一个变量（.env 里的 PB_CADDY_HOST），后端端口写死在 Caddyfile 里，与服务端同口径。
    environment:
      PB_CADDY_HOST: ${PB_CADDY_HOST:-pushbox.internal}
    ports:
      - "${PB_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pushbox-server:
        condition: service_healthy
    restart: unless-stopped

  # ---- 拓扑 B 才需要：独立 MySQL / RustFS ----
  # 这一段整体是注释，取消注释才生效。里面保留 ${VAR:?}：这两个镜像只认环境变量，
  # 而会取消它的人一定在有 .env 的机器上（用命令行 compose 才会走到拓扑 B）。
  # 取消注释后，安装页里的库地址填 mysql、口令填这里的 MYSQL_PASSWORD 同一个值，
  # 对象存储填 http://rustfs:9000 + 这里的 RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY。
  # mysql:
  #   image: mysql:8.4
  #   # ngram_token_size=2 是 §3.2 中文全文索引的前提，必须在初始化时就带上。
  #   command: --ngram_token_size=2
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
  #     MYSQL_DATABASE: pushbox
  #     MYSQL_USER: pushbox
  #     MYSQL_PASSWORD: ${PB_DB_PASSWORD:?PB_DB_PASSWORD 未设置}
  #   volumes:
  #     - ./data/mysql:/var/lib/mysql
  #   restart: unless-stopped
  #
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   environment:
  #     RUSTFS_ACCESS_KEY: ${PB_S3_ACCESS_KEY:?PB_S3_ACCESS_KEY 未设置}
  #     RUSTFS_SECRET_KEY: ${PB_S3_SECRET_KEY:?PB_S3_SECRET_KEY 未设置}
  #   volumes:
  #     - ./data/rustfs:/data   # 宿主目录必须 chown 10001:10001，否则 RustFS 拒绝写
  #   restart: unless-stopped

  # prometheus / grafana 不在这里，见 docker-compose.monitoring.yml。
  # 原因是 compose 的 ${VAR:?} 插值发生在"整本文件"层面，跟 profile 有没有激活无关：
  # grafana 那句 GRAFANA_ADMIN_PASSWORD:? 会把"没开监控"的常规部署也一起卡死。
  # 主文件现在一项服务端 ${VAR:?} 都没有（服务端根本不读环境变量），监控那本文件却仍然用它自己的
  # 那条 :? 插值：只有显式多传一个 -f 的人才受它管，这正好是想要的边界。

volumes:
  caddy_data: {}
  caddy_config: {}
  pushbox_data: {}
