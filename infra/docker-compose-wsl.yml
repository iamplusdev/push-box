# WSL Docker 测试环境 - 完整独立部署（拓扑 B）：MySQL + RustFS + PushBox Server + Caddy
#
# 服务端不读环境变量，所以 pushbox-server 那一段没有 environment:。配置从安装页来：
# 容器起来后停在安装页上，deploy-wsl.sh 的 `setup` 子命令会把 infra/wsl-test.env 里那几个测试值
# POST 到 /api/v1/setup —— 走的是和真人点「保存并启动」完全相同的一条路，所以这套栈顺带就是
# 安装页的端到端验证。手工来也一样：浏览器打开 http://localhost:7404/ 自己填。
#
# 环境变量在这本文件里只剩两类：
#   · 第三方镜像自己的（mysql / rustfs / grafana）——它们只认这个；
#   · 宿主侧的端口映射（PB_HTTP_PORT）——不进容器。
# 取值都从 infra/wsl-test.env 来（--env-file 传进去，那份文件不入库）。

name: pushbox-test

services:
  pushbox-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: pushbox/server:1.1.6
    volumes:
      # 与主文件同口径：一个 named volume 装下 config/ + media/ + logs/。
      # 测试栈刻意不用 ./data 绑定挂载——deploy-wsl.sh 多半跑在 /mnt/d 上，drvfs 不支持 chown，
      # 宿主目录属主进不了 10001，entrypoint 的写入探针会直接拒绝启动。
      # 清数据用 `deploy-wsl.sh clean`（内部是 docker compose down -v），不是 rm 目录。
      - server_data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7404"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    restart: unless-stopped
    ports:
      - "${PB_SERVER_PORT:-7404}:7404"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - pushbox-net

  caddy:
    image: caddy:2
    environment:
      PB_CADDY_HOST: ${PB_CADDY_HOST:-localhost}
    ports:
      - "${PB_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pushbox-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pushbox-net

  # MySQL 数据库。安装页里「数据库地址」填 mysql（服务名），口令填这里的 MYSQL_PASSWORD 同一个值。
  mysql:
    image: mysql:8.4
    command: --ngram_token_size=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      MYSQL_DATABASE: pushbox
      MYSQL_USER: pushbox
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pushbox", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    networks:
      - pushbox-net

  # RustFS 对象存储。安装页里勾「改用对象存储」，地址填 http://rustfs:9000，
  # AK/SK 填下面这两项的同值。
  # 镜像监听 9000（S3 API）/ 9001（Console）。这里曾经写成 7101（那是远端存储机上那台实例的端口，
  # 不是镜像默认值）：因为 /healthz 的 storage 只判"配置非空"，错端口一路显示 up，
  # 直到第一条带图的消息才暴露。现在安装页的「测试连接」会当场 putObject + deleteObject 一次，
  # 端口填错在保存之前就会被拦下来。
  # 桶不会自动创建，首次部署补一次（rustfs 镜像里没有 S3 客户端；`minio/mc` 已从 Docker Hub 下架，实测 404）。
  # 这份 compose 不给 rustfs 发布端口，所以客户端要借 rustfs 自己的网络命名空间才够得着 127.0.0.1:9000：
  #   docker run --rm --network container:"$(docker compose -f infra/docker-compose-wsl.yml ps -q rustfs)" \
  #     -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION=us-east-1 \
  #     amazon/aws-cli --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket pushbox
  #   有 mc 的话同理：mc alias set pb http://127.0.0.1:9000 <AK> <SK> && mc mb pb/pushbox
  # deploy-wsl.sh 的 `bucket` 子命令就是上面那条。
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 未设置}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY 未设置}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    networks:
      - pushbox-net

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - pushbox-net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 未设置}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - pushbox-net

volumes:
  caddy_data: {}
  caddy_config: {}
  server_data: {}
  mysql_data: {}
  rustfs_data: {}

networks:
  pushbox-net:
    driver: bridge
