name: CI

# PR / 推 main 的门禁：只判红绿，不出制品（制品由 build-apk / build-msi / docker-publish 三个 workflow 负责）。
# 这个 workflow 存在的唯一理由是 docker-publish.yml 顶上那句"不在这里跑 mvn verify"：
# 服务端有 33 个用例靠"有没有真桶"决定跑不跑（见 dev.pushbox.server.test.TestConfig 的两档闸门），
# 没有库和桶时它们会静默 skip，于是"全绿"可以意味着"什么都没测"。这里用 service container 起真
# MySQL + 真 RustFS，并在最后把 surefire 汇总的 skipped 断成必须为 0 —— 这一条才是"闸门用例真跑过"的证据。
# 判据的来源不再是环境变量（服务端已经不读环境变量了），而是下面那一步写出的
# apps/server/data/config/pushbox.json —— 与真部署时安装页落盘的是同一个文件、同一份形状。
# 三端各自的最小可跑口径：
#   server    mysql:8.4（--ngram_token_size=2，V1 的 FULLTEXT 索引与 SearchServiceTest 都依赖它）+ rustfs
#   web-admin npm ci && npm run build（vue-tsc -b 是类型门禁，vite build 顺带证明能烘进镜像）
#   windows   dotnet test ——必须 windows runner：PushBox.Crypto.Tests 引用 WinUI/WPF 主项目（net8.0-windows*）
#   android   ./gradlew :app:assembleDebug（不签名，只为让 PR 上就能看到编译退化）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: 服务端测试（MySQL + RustFS）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        # ngram 分词器只在建索引时按服务器参数生效，跑完再改无效，所以必须在这里就带上。
        command: --ngram_token_size=2
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pushbox
          MYSQL_USER: pushbox
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
      rustfs:
        image: rustfs/rustfs:latest
        # 环境变量名与 infra/docker-compose-wsl.yml 一致。端口按镜像自己的口径：
        # rustfs/rustfs:latest 监听 9000（S3 API）与 9001（Console）。
        # 远端那台存储机是在 7101 上跑的（§11.1 实测过），别把 7101 当成 RustFS 的默认端口 ——
        # 这个错在 infra/wsl-test.env 里存了整整一版测试环境：healthz 的 storage 只判"配置非空"，
        # 所以 http://rustfs:7101 一路显示 up，直到第一条带图的消息才会撞成 failed。
        env:
          RUSTFS_ACCESS_KEY: ci-s3-access-key
          RUSTFS_SECRET_KEY: ci-s3-secret-key-0123456789
        ports:
          - 9000:9000
    env:
      # 这两个键只给下面"建桶"那一步用（aws CLI 的凭据），不再透传给服务端进程：
      # 服务端已经不读环境变量了，它的配置来自下面那一步写出的 apps/server/data/config/pushbox.json。
      S3_ACCESS_KEY: ci-s3-access-key
      S3_SECRET_KEY: ci-s3-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 服务端配置的唯一来源：工作目录下的 data/config/pushbox.json（surefire 的工作目录是 apps/server/）。
      # 这个文件在仓库里不存在（.gitignore 排掉了 /apps/server/data/），真部署时它由安装页写出来；
      # CI 里没有浏览器可点，所以直接把它写出来——内容就是安装页那一次 POST 的 JSON。
      # 两档闸门（dev.pushbox.server.test.TestConfig）读的都是这一份：
      #   databaseReady()      13 个类，只要库连得上就跑（存储走本地目录也行）
      #   objectStorageReady() 5 个 media 类，要真桶（验的是 SSE-C/预签名/删除这类 S3 语义）
      # s3 勾上、四件套填全，两档才都为真，最后那条 skipped==0 的断言才有意义。
      - name: 写出服务端配置（等价于在安装页里点「保存并启动」）
        run: |
          set -euo pipefail
          mkdir -p apps/server/data/config
          cat > apps/server/data/config/pushbox.json <<'JSON'
          {
            "port": 7404,
            "database": {
              "host": "127.0.0.1",
              "port": 3306,
              "name": "pushbox",
              "username": "pushbox",
              "password": "ci-db-password"
            },
            "storage": {
              "s3": true,
              "localPath": "data/media",
              "endpoint": "http://127.0.0.1:9000",
              "region": "us-east-1",
              "bucket": "pushbox",
              "accessKey": "ci-s3-access-key",
              "secretKey": "ci-s3-secret-key-0123456789",
              "pathStyle": true,
              "encrypted": false,
              "passphrase": "",
              "masterKey": ""
            },
            "admin": { "password": "", "jwtKey": "" },
            "security": { "internalCidrs": [] }
          }
          JSON
          echo "✅ 配置已写出：$(wc -c < apps/server/data/config/pushbox.json) 字节"

      # service container 没有 HEALTHCHECK 时 Actions 只等 20 秒，MySQL 首轮初始化（建系统表）不止这些，
      # 所以显式等 mysqladmin 能应答，而不是让 Flyway 去撞一个"能连上但还没就绪"的 3306。
      - name: 等 MySQL 就绪
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent 2>/dev/null; then
              echo "MySQL 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 3
          done
          echo "::error::MySQL 90 秒内没就绪"
          exit 1

      # 桶不会自动出现：仓库里没有建桶的地方（infra/compose 都没有），历史联调用的那只桶是当年手工建的。
      # 不建桶的话第一条带图消息才会报错，而 CI 里没有那条消息 —— 所以在这里显式建，把运维缺口也钉住。
      # 客户端用 runner 自带的 AWS CLI（Ubuntu 24.04 镜像 Readme 实测预装 2.37.13），不再拉 mc 镜像：
      # minio/mc 已经从 Docker Hub 下架（hub.docker.com/v2/repositories/minio/mc 实测 404），
      # 2026-10-20 main 首跑就是死在这一步的镜像 pull 上（exit 125 "repository does not exist"）。
      # 换成 aws 之前先在本地对真 RustFS 容器验过：create-bucket 退 0、重复创建幂等、head-bucket 能确认桶在。
      - name: 等 RustFS 就绪并建桶
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if (exec 3<>"/dev/tcp/127.0.0.1/9000") 2>/dev/null; then break; fi
            if [ "$i" = 40 ]; then echo "::error::RustFS 端口 9000 40 次没通"; exit 1; fi
            sleep 3
          done
          command -v aws >/dev/null || { echo "::error::runner 镜像里没有 aws CLI，这条建桶路径需要换一个 S3 客户端"; exit 1; }
          # us-east-1 只是 SigV4 签名的必填项，RustFS 不看它；EC2 元数据探测在 runner 上只会白等。
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket pushbox
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket pushbox
          echo "✅ 桶 pushbox 已就绪"

      - name: mvn -B -pl :pushbox-server -am test
        run: mvn -B -pl :pushbox-server -am test

      # 闸门用例的存在性证明：skipped 必须为 0，且执行总数不低于实测基线。
      # 只判"mvn 退出码 0"是不够的 —— 凭据没传进去时它同样退 0。
      # 基线是 2026-10-23 用 JDK 21 实跑出来的 surefire 汇总：server 289 + core 43 = 332。
      # 这个数字只许涨不许跌；跌了说明有人删了测试或改了 include 规则，而不是"环境不一样"。
      # 223 → 227 是 AdminControllerBodyTest 那 4 条（管理台坏请求体返 400 的收口用例）；
      # 227 → 232 是 DeviceControllerBodyTest 那 5 条（设备侧同一收口），两次都是同版本 JDK 实跑抬的。
      # 232 → 235 是定时任务分类标签：1 条归一与回显（Mockito）+ 2 条真库往返（ScheduledTaskStoreTest，
      # 它同时是 Flyway V9 与 insertScheduledTask 那份列清单/占位符的往返证明）。
      # 235 → 237 与 core 38 → 43 是"尾部垃圾 JSON"这一条：core 那 5 条（JsonTrailingTokenTest）把三条入站
      # 解析路子的宽松度钉死，server 这 2 条确认同一份严格度落到 HTTP 上是 400 信封而不是 500。
      # 237 → 239 是管理台建频道的 Space 校验（AdminControllerBodyTest ⑥⑦）：groupId 省略/空白与 groups 表
      # 查无此 id 一律 400，不再回退到 DeviceGuard 那个虚拟的 "admin" 建出设备永远查不到的孤立 Space。
      # 239 → 245 是 PushboxWsHandlerTest 的 6 条：hello 帧、验签失败、kx+resume_ok、补拉逐批取空、
      # gap-threshold 配置化、心跳判死/发 ping。
      # 245 → 249 是 PushboxWsSocketTest 的 4 条真 socket 用例：真 Tomcat + JDK WebSocket 客户端，
      # 走完 hello→auth→kx→补拉、心跳与帧数轮换、resume_gap、坏签名 1008。
      # 这条 trail 到此是 server 数；总基线跟着 273 → 280 → 282 → 288 → 292（core 也在动，往后别再只记 server 那一半）。
      # 249 → 258 是本轮的 9 条：SpaWebConfigTest 7 条（单镜像里"未注册路径不该吞成 200+HTML"那条判据，
      # 含"jar 里没有 index.html 时回退要返回 null 而不是抛异常"）+ DevCredentialsGuardTest 2 条
      # （PB_STORAGE_TYPE=local 时只查 PB_DB_PASSWORD、=s3 时才点 PB_S3_* 三件套的名）。
      # 258 → 260 是同一闸门类的 ⑨⑩ 两条：local 模式却带着 PB_S3_* 必须出声（只报键名与落盘目录，
      # 值一个字不进日志），真跑 s3 时这句不许响——必填项分档之后"忘了设 type"不再让启动失败，
      # 只会让整轮测试静默跑在本地目录上，所以反向那条判据也得有用例兜着。
      # 260 → 263 是 StorageWiringTest 那 3 条：它跑真 AnnotationConfigApplicationContext 而不是手工 new，
      # 因为 local 模式起不来那条缺陷（`@Bean` 返回 null = NullBean = "没有这个 bean"）只有容器才照得出来。
      # 263 → 265 是 ProdPlaintextMediaGuardTest 的 ⑤⑥ 两条：本地盘明文只出声不拒启（D76 把门槛按存储拓扑分档，
      # 拒启只会逼人为了过检查去配一个用不到的桶）、反向那条确认判据只认 local——其余取值（含没映射到的旧配置）
      # 一律按最严的桶形态判，别让"读不到配置"被当成"选了本地盘"。
      # 265 → 276 是 MediaKeyServiceTest 的 11 条：口令确定性地派生 KEK、每次安装不同盐、KCV 拒绝错口令、
      # 主钥与口令二选一、两种模式切换的闸门、旧封装钥挡住口令模式、空库不提前写 state、NFC/空白归一。
      # 总基线 292 → 301 → 303 → 306 → 308 → 319。
      # 319 → 327 是配置重构那一轮：删掉 DevCredentialsGuardTest 10 条与 ProdPlaintextMediaGuardTest 7 条
      # （两个守卫随"配置搬进安装页"一起没了），补上 RuntimeConfigTest 9 条 + InstallServerTest 11 条
      # + RuntimeConfigEnvironmentPostProcessorTest 5 条 = 25 条，净 +8。server 276 → 284。
      # 327 → 328 是 InstallServerTest ⑫ 一条：钉住安装页里硬编码的 MySQL 驱动类名。
      # 它是 fat jar 那条真缺陷的唯一残留判据——`DriverManager` 用系统类加载器跑 ServiceLoader，
      # 看不见 BOOT-INF/lib 里的连接器，于是安装页在容器里报 "No suitable driver found"，
      # 而 exploded classpath 上永远绿。真正拦得住的判据是 scripts/install-page-smoke.sh
      # （release-server.sh 第 3 步会真跑一次 fat jar），这条只管"类名和连接器还对得上"。
      # 328 → 329 是 InstallServerTest ⑬ 一条：真起一次安装页的 HttpServer，POST 一份合法配置，
      # 断言客户端拿到的是完整响应。它钉的是"放行启动必须排在写回之后"——原来 install() 在 return
      # 之前就 countDown，awaitConfiguration() 一醒立刻 stop，于是配置真的落盘了、Spring 也起来了，
      # 而 curl 只拿到截断的空响应，部署脚本据此报"连不上安装页"。做过负测：把 countDown 挪回
      # install() 里、stop 改回 0，这条当场红成 "HTTP/1.1 header parser received no bytes"。
      # 329 → 331 是"图片抓取放行主机"进表单那两条：InstallServerTest ⑭（只认 host 或 host:port，
      # 带 scheme、带路径、带通配一律拦）+ RuntimeConfigTest ⑩（拼成 pb.media.allow-hosts，
      # normalize() 把大小写与空格归一——SsrfGuard 是精确等值比较，不归一就等于这一项白填）。
      # 331 → 332 是 InstallServerTest ⑮：未配置时 /dashboard、/login、/admin 一律 302 回 `/`，
      # 且页面里注入的是安装页真实监听的端口（容器 7405→7404 时 location.port 是宿主那侧，不能用）。
      - name: 断言 DB 闸门用例真的执行了
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("apps/server/target/surefire-reports/TEST-*.xml") + \
                  glob.glob("packages/core/target/surefire-reports/TEST-*.xml")
          if not files:
              print("::error::没有 surefire 报告，测试根本没跑"); sys.exit(1)
          tests = skipped = 0
          for f in files:
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); skipped += int(r.get("skipped", 0))
          print(f"用例总数={tests} 跳过={skipped} 执行={tests - skipped}")
          if skipped != 0:
              print("::error::有 %d 条用例被跳过：DB/S3 凭据没传到位（见本 job 顶部说明），全绿不代表测过" % skipped)
              sys.exit(1)
          if tests < 332:
              print("::error::用例总数 %d 低于基线 332，测试被静默裁剪了" % tests); sys.exit(1)
          print("✅ 闸门用例全部执行")
          PY

      - name: 失败时保留 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            apps/server/target/surefire-reports/
            packages/core/target/surefire-reports/
          retention-days: 7

  web-admin:
    name: 管理台类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - name: npm ci && npm run build
        working-directory: apps/web-admin
        run: |
          npm ci
          npm run build
      - name: 断言产物非空
        run: |
          set -euo pipefail
          [ -s apps/web-admin/dist/index.html ] || { echo "::error::apps/web-admin/dist/index.html 缺失，前端构建没出东西"; exit 1; }
          echo "✅ 管理台产物：$(find apps/web-admin/dist -type f | wc -l) 个文件"

  windows:
    name: Windows 端测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet build 主工程
        working-directory: apps/windows
        run: dotnet build PushBox.Windows/PushBox.Windows.csproj -c Release --nologo
      # 这一条是 2026-10-23 从 build-msi.yml 的 main 触发里搬过来的：那条链现在只认 windows-v* 标签，
      # 推 main 不再打安装包，于是"主工程编得过"这件事整个仓里只剩这里在管。它只 build 不 publish、
      # 不装 Inno、不出任何可分发产物——打包仍然是发版时的事。
      - name: dotnet test PushBox.Crypto.Tests
        id: dotnet
        working-directory: apps/windows
        run: dotnet test PushBox.Crypto.Tests/PushBox.Crypto.Tests.csproj -c Release --nologo --results-directory TestResults --logger "trx;LogFileName=crypto.trx"
      # C# 侧原来没有基线闸：dotnet test 的退出码只回答"有没有红"，用例被静默裁掉（删了 [Fact]、
      # 改了分类过滤、整类没被 discover）它照样退 0，而 README / 两份指南 / site/ 里的数字是人手抄的。
      # 2026-10-22 就抓到 发布准备报告 还挂着 556/556、其余六处已经改成实测 554 —— 和 Java 那边
      # 同一个失效方式。所以这里用 trx 数出真实条数（不看控制台文案，避免 runner 语言影响解析），
      # 下面这一行的数字是 release-verify.sh 里 C# 计数闸读的唯一真值：改了它就同步改文档，别反过来。
      #
      # `if: always()` 不是可选的：这一步默认继承 success()，于是 dotnet test 一旦非零退出它就整个被
      # 跳过——而"到底是哪几条红了"只有这一步答得出。2026-10-22 在 head `7b148ea` 上就是这么错过的：
      # 匿名能读到的 annotation 只剩一句 `Process completed with exit code 1`，日志要登录才打得开，
      # 本机同一条命令 554/554 全绿，于是连"是不是脆用例"都判不了。trx 里的 `outcome` 与 `errorInfo.message`
      # 都在文件里，把它写成 annotation（check-run annotations 端点匿名可读）就等于把红因发到公开面上。
      - name: 断言 C# 用例数没有被静默裁剪
        if: always()
        working-directory: apps/windows
        shell: pwsh
        env:
          DOTNET_OUTCOME: ${{ steps.dotnet.outcome }}
        run: |
          $CS_BASELINE = 554
          $trx = Get-ChildItem -Path TestResults -Recurse -Filter crypto.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            Write-Output "::error::没有 crypto.trx（dotnet test 这步 outcome=$env:DOTNET_OUTCOME）：还原或编译就断了，不是用例红——去看上面那步"
            exit 1
          }
          [xml]$report = $null
          try {
            $report = Get-Content -LiteralPath $trx.FullName -Raw
          } catch {
            Write-Output "::error::crypto.trx 读不出来：$($_.Exception.Message)"
            exit 1
          }
          if (-not $report -or -not $report.TestRun) {
            # 这一句不是多余的防御：trx 半路损坏时 [xml] 转换会把 $report 留成空，而下面那句
            # `$report.TestRun.Results.UnitTestResult` 会当成"一条用例、没通过"，把红因写成空气。
            Write-Output "::error::crypto.trx 解析失败（不是 XmlDocument），这一条不能当作用例红来报"
            exit 1
          }
          $results = @($report.TestRun.Results.UnitTestResult)
          $notPassed = @($results | Where-Object { $_.outcome -ne 'Passed' })
          Write-Output "C# 用例总数=$($results.Count) 未通过=$($notPassed.Count)（dotnet test 这步 outcome=$env:DOTNET_OUTCOME）"
          if ($notPassed.Count -gt 0) {
            $i = 0
            foreach ($r in ($notPassed | Select-Object -First 12)) {
              $i++
              # 只取断言输出的第一行并压掉换行：workflow command 的 value 里带 \r\n 会把一条
              # annotation 截成两行，后半段变成没人认领的日志噪声。
              # 路径是 Output/ErrorInfo/Message 而不是 result 直接挂 errorInfo——PowerShell 的
              # XmlDocument 适配器按子元素层级出属性，写成 $r.errorInfo 会静默拿到空值，
              # 于是 annotation 里只剩用例名、断言那句话整个丢掉（本机变异用例实测出来的）。
              $msg = ''
              if ($r.Output -and $r.Output.ErrorInfo -and $r.Output.ErrorInfo.Message) {
                $msg = (($r.Output.ErrorInfo.Message -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 1) -replace '\s+', ' '
              }
              $line = "[$i/$($notPassed.Count)] $($r.testName) 结果=$($r.outcome) $msg"
              Write-Output "::error::$($line -replace '\r?\n', ' ')"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- ``$($r.testName)`` — $($r.outcome)：$msg"
            }
            exit 1
          }
          if ($env:DOTNET_OUTCOME -ne 'success') {
            # trx 里全绿可上一步还是非零退出——那是 runner/工具链侧的事，不能报"✅ 全部执行"糊过去。
            Write-Output "::error::用例全绿但 dotnet test 退出码非 0（outcome=$env:DOTNET_OUTCOME）：还原/编译/工具链问题，不是用例红"
            exit 1
          }
          if ($results.Count -lt $CS_BASELINE) {
            Write-Output "::error::用例总数 $($results.Count) 低于基线 $CS_BASELINE，测试被静默裁剪了"
            exit 1
          }
          Write-Output "✅ C# 用例全部执行且不低于基线"

  android:
    name: Android 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # 不再用 android-actions/setup-android@v3：它要装已经下架的 legacy `tools` 包，2026-10-20 main 首跑
      # 就是它把这个 job 跑红的（sdkmanager 退出 1，"Failed to find package 'tools'"）。
      # runner 镜像本身就把本项目要的东西装好了（Ubuntu 24.04 镜像 Readme 实测：platforms 含 android-36、
      # build-tools 含 36.0.0/36.1.0、platform-tools 37.0.1，且 ANDROID_HOME/ANDROID_SDK_ROOT 已导出）；
      # 真缺组件时 AGP 会自己走 sdkmanager 补。这里只做一次入镜检查，为的是下次红能一眼看出缺哪一项。
      - name: 核对 runner 预装的 Android SDK
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::runner 没导出 ANDROID_HOME，本步依赖的预装 SDK 前提变了"; exit 1; }
          CS=$(grep -m1 -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' apps/android/app/build.gradle.kts | grep -oE '[0-9]+' || true)
          [ -n "$CS" ] || { echo "::error::没能从 apps/android/app/build.gradle.kts 读出 compileSdk"; exit 1; }
          [ -d "$ANDROID_HOME/platforms/android-$CS" ] || { echo "::error::缺 platforms/android-$CS（compileSdk=$CS）"; exit 1; }
          [ -n "$(ls -A "$ANDROID_HOME/build-tools" 2>/dev/null)" ] || { echo "::error::缺 build-tools"; exit 1; }
          echo "✅ compileSdk=$CS 在位；build-tools：$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew
      - name: ./gradlew :app:assembleDebug
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon
