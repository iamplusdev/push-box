name: CI

# PR / 推 main 的门禁：只判红绿，不出制品（制品由 build-apk / build-msi / docker-publish 三个 workflow 负责）。
# 这个 workflow 存在的唯一理由是 docker-publish.yml 顶上那句"不在这里跑 mvn verify"：
# 服务端有 112 个用例靠 PB_S3_ACCESS_KEY 这个环境变量决定跑不跑（见 dev/pushbox 测试约定），
# 没有库和桶时它们会静默 skip，于是"全绿"可以意味着"什么都没测"。这里用 service container 起真
# MySQL + 真 RustFS，并在最后把 surefire 汇总的 skipped 断成必须为 0 —— 这一条才是"闸门用例真跑过"的证据。
# 三端各自的最小可跑口径：
#   server    mysql:8.4（--ngram_token_size=2，V1 的 FULLTEXT 索引与 SearchServiceTest 都依赖它）+ rustfs
#   web-admin npm ci && npm run build（vue-tsc -b 是类型门禁，vite build 顺带证明能烘进镜像）
#   windows   dotnet test ——必须 windows runner：PushBox.Crypto.Tests 引用 WinUI/WPF 主项目（net8.0-windows*）
#   android   ./gradlew :app:assembleDebug（不签名，只为让 PR 上就能看到编译退化）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: 服务端测试（MySQL + RustFS）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        # ngram 分词器只在建索引时按服务器参数生效，跑完再改无效，所以必须在这里就带上。
        command: --ngram_token_size=2
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pushbox
          MYSQL_USER: pushbox
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
      rustfs:
        image: rustfs/rustfs:latest
        # 环境变量名与 deploy/docker-compose-wsl.yml 一致。端口按镜像自己的口径：
        # rustfs/rustfs:latest 监听 9000（S3 API）与 9001（Console）。
        # 远端那台存储机是在 7101 上跑的（§11.1 实测过），别把 7101 当成 RustFS 的默认端口 ——
        # 这个错在 deploy/wsl-test.env 里存了整整一版测试环境：healthz 的 storage 只判"配置非空"，
        # 所以 http://rustfs:7101 一路显示 up，直到第一条带图的消息才会撞成 failed。
        env:
          RUSTFS_ACCESS_KEY: ci-s3-access-key
          RUSTFS_SECRET_KEY: ci-s3-secret-key-0123456789
        ports:
          - 9000:9000
    env:
      # 这四个键就是 DevCredentialsGuard 点名的那一组：缺任何一个，DB 闸门用例会 skip 而不是失败。
      PB_DB_PASSWORD: ci-db-password
      PB_S3_ENDPOINT: http://127.0.0.1:9000
      PB_S3_ACCESS_KEY: ci-s3-access-key
      PB_S3_SECRET_KEY: ci-s3-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # service container 没有 HEALTHCHECK 时 Actions 只等 20 秒，MySQL 首轮初始化（建系统表）不止这些，
      # 所以显式等 mysqladmin 能应答，而不是让 Flyway 去撞一个"能连上但还没就绪"的 3306。
      - name: 等 MySQL 就绪
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent 2>/dev/null; then
              echo "MySQL 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 3
          done
          echo "::error::MySQL 90 秒内没就绪"
          exit 1

      # 桶不会自动出现：仓库里没有建桶的地方（deploy/compose 都没有），历史联调用的那只桶是当年手工建的。
      # 不建桶的话第一条带图消息才会报错，而 CI 里没有那条消息 —— 所以在这里显式建，把运维缺口也钉住。
      # 客户端用 runner 自带的 AWS CLI（Ubuntu 24.04 镜像 Readme 实测预装 2.37.13），不再拉 mc 镜像：
      # minio/mc 已经从 Docker Hub 下架（hub.docker.com/v2/repositories/minio/mc 实测 404），
      # 2026-10-20 main 首跑就是死在这一步的镜像 pull 上（exit 125 "repository does not exist"）。
      # 换成 aws 之前先在本地对真 RustFS 容器验过：create-bucket 退 0、重复创建幂等、head-bucket 能确认桶在。
      - name: 等 RustFS 就绪并建桶
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if (exec 3<>"/dev/tcp/127.0.0.1/9000") 2>/dev/null; then break; fi
            if [ "$i" = 40 ]; then echo "::error::RustFS 端口 9000 40 次没通"; exit 1; fi
            sleep 3
          done
          command -v aws >/dev/null || { echo "::error::runner 镜像里没有 aws CLI，这条建桶路径需要换一个 S3 客户端"; exit 1; }
          # us-east-1 只是 SigV4 签名的必填项，RustFS 不看它；EC2 元数据探测在 runner 上只会白等。
          export AWS_ACCESS_KEY_ID="$PB_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$PB_S3_SECRET_KEY" \
            AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket pushbox
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket pushbox
          echo "✅ 桶 pushbox 已就绪"

      - name: mvn -B -pl server -am test
        run: mvn -B -pl server -am test

      # 闸门用例的存在性证明：skipped 必须为 0，且执行总数不低于实测基线。
      # 只判"mvn 退出码 0"是不够的 —— 凭据没传进去时它同样退 0。
      # 基线是 2026-10-20 用 JDK 21 实跑出来的 surefire 汇总：server 223（其中 112 条是闸门类）+ core 38 = 261。
      # 这个数字只许涨不许跌；跌了说明有人删了测试或改了 include 规则，而不是"环境不一样"。
      - name: 断言 DB 闸门用例真的执行了
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("server/target/surefire-reports/TEST-*.xml") + \
                  glob.glob("core/target/surefire-reports/TEST-*.xml")
          if not files:
              print("::error::没有 surefire 报告，测试根本没跑"); sys.exit(1)
          tests = skipped = 0
          for f in files:
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); skipped += int(r.get("skipped", 0))
          print(f"用例总数={tests} 跳过={skipped} 执行={tests - skipped}")
          if skipped != 0:
              print("::error::有 %d 条用例被跳过：DB/S3 凭据没传到位（见本 job 顶部说明），全绿不代表测过" % skipped)
              sys.exit(1)
          if tests < 261:
              print("::error::用例总数 %d 低于基线 261，测试被静默裁剪了" % tests); sys.exit(1)
          print("✅ 闸门用例全部执行")
          PY

      - name: 失败时保留 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            server/target/surefire-reports/
            core/target/surefire-reports/
          retention-days: 7

  web-admin:
    name: 管理台类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: npm ci && npm run build
        working-directory: web-admin
        run: |
          npm ci
          npm run build
      - name: 断言产物非空
        run: |
          set -euo pipefail
          [ -s web-admin/dist/index.html ] || { echo "::error::web-admin/dist/index.html 缺失，前端构建没出东西"; exit 1; }
          echo "✅ 管理台产物：$(find web-admin/dist -type f | wc -l) 个文件"

  windows:
    name: Windows 端测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet test PushBox.Crypto.Tests
        working-directory: windows
        run: dotnet test PushBox.Crypto.Tests/PushBox.Crypto.Tests.csproj -c Release --nologo

  android:
    name: Android 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # 不再用 android-actions/setup-android@v3：它要装已经下架的 legacy `tools` 包，2026-10-20 main 首跑
      # 就是它把这个 job 跑红的（sdkmanager 退出 1，"Failed to find package 'tools'"）。
      # runner 镜像本身就把本项目要的东西装好了（Ubuntu 24.04 镜像 Readme 实测：platforms 含 android-36、
      # build-tools 含 36.0.0/36.1.0、platform-tools 37.0.1，且 ANDROID_HOME/ANDROID_SDK_ROOT 已导出）；
      # 真缺组件时 AGP 会自己走 sdkmanager 补。这里只做一次入镜检查，为的是下次红能一眼看出缺哪一项。
      - name: 核对 runner 预装的 Android SDK
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::runner 没导出 ANDROID_HOME，本步依赖的预装 SDK 前提变了"; exit 1; }
          CS=$(grep -m1 -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+' || true)
          [ -n "$CS" ] || { echo "::error::没能从 android/app/build.gradle.kts 读出 compileSdk"; exit 1; }
          [ -d "$ANDROID_HOME/platforms/android-$CS" ] || { echo "::error::缺 platforms/android-$CS（compileSdk=$CS）"; exit 1; }
          [ -n "$(ls -A "$ANDROID_HOME/build-tools" 2>/dev/null)" ] || { echo "::error::缺 build-tools"; exit 1; }
          echo "✅ compileSdk=$CS 在位；build-tools：$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: ./gradlew :app:assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
