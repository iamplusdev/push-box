name: Build Android APK

# 推 main 打包并挂成 workflow artifact（每次都能下载测试）；打 v* 标签时额外发布到 GitHub Release。
# 需要配的 Secrets（release 必须签名：未配置或误用 debug 签名一律判失败，不再回退 debug）：
#   ANDROID_KEYSTORE_BASE64   release keystore 的 base64（keytool 生成后 base64 -w0 keystore.jks）
#   ANDROID_KEYSTORE_PASSWORD keystore 口令
#   ANDROID_KEY_ALIAS         别名
#   ANDROID_KEY_PASSWORD      私钥口令（多数与 keystore 口令相同）
# tag 事件不再带 paths 过滤（否则只改了其它目录的 commit 打 tag 会静默不发布）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag 事件里 gh release 建/传资产用；main 事件用不到但不影响

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接写进步骤 if，映射到 env 再用 env.* 判空。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 同 ci.yml 的 android job：不用 android-actions/setup-android@v3（它要装已下架的 legacy `tools` 包，
      # 2026-10-20 那次红就是它造成的），改用 runner 预装 SDK + 一次入镜检查。
      # apksigner 来自 $ANDROID_HOME/build-tools/<最新版>，下一步把它挂进 PATH，所以这里必须确认 build-tools 非空。
      - name: 核对 runner 预装的 Android SDK
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::runner 没导出 ANDROID_HOME，本步依赖的预装 SDK 前提变了"; exit 1; }
          CS=$(grep -m1 -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+' || true)
          [ -n "$CS" ] || { echo "::error::没能从 android/app/build.gradle.kts 读出 compileSdk"; exit 1; }
          [ -d "$ANDROID_HOME/platforms/android-$CS" ] || { echo "::error::缺 platforms/android-$CS（compileSdk=$CS）"; exit 1; }
          [ -n "$(ls -A "$ANDROID_HOME/build-tools" 2>/dev/null)" ] || { echo "::error::缺 build-tools（apksigner 无处可取）"; exit 1; }
          echo "✅ compileSdk=$CS 在位；build-tools：$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      # 统一版本号注入（从 git tag 或 run number 提取）
      - name: Set version from git tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"  # v1.0.0 -> 1.0.0
          else
            VERSION="0.1.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Inject version into Android build
        run: |
          # 正式 tag（X.Y.Z）才注入；main/dispatch 的 0.1.0-<run> 非正式版本脚本会判失败，
          # 这里容忍并沿用已提交默认，保证 main 每次都能产出可下载 artifact。
          bash scripts/set-version.sh "${{ steps.version.outputs.version }}" \
            || echo "⚠️ 非正式版本（${{ steps.version.outputs.version }}）跳过注入，沿用已提交 versionCode/versionName。"

      - name: Put build-tools on PATH (for apksigner)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 这一步就是定根因的那一步：它打出来的 502/502/502 说明 runner 打 maven.aliyun.com 整片被拒，
      # 而当时镜像写在 android/settings.gradle.kts 的 pluginManagement 最前面，KSP 的插件 marker 因此
      # 被报成"六个仓库都没有"（本机在墙内看不见这个 502，所以本地一直绿）。
      # 口径已改成"默认官方源、开发机用 local.properties 的 pb.maven.cnMirror=true 开镜像"，
      # 所以这条链一旦跑绿就该删掉这一步——留着就是每次三行没有意义的 502。
      - name: 探测插件仓库对 KSP marker 的响应
        run: |
          set -uo pipefail
          V=$(grep -m1 -oE '^ksp = "[^"]*"' android/gradle/libs.versions.toml | sed -E 's/.*"([^"]*)".*/\1/')
          [ -n "$V" ] || { echo "读不到 ksp 版本，跳过探测"; exit 0; }
          P="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/$V/com.google.devtools.ksp.gradle.plugin-$V.pom"
          echo "KSP marker：$V"
          for base in https://maven.aliyun.com/repository/google \
                      https://maven.aliyun.com/repository/public \
                      https://maven.aliyun.com/repository/gradle-plugin \
                      https://dl.google.com/dl/android/maven2 \
                      https://repo.maven.apache.org/maven2 \
                      https://plugins.gradle.org/m2 ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$base/$P")
            [ "$code" = 000 ] && code="连接失败"
            echo "  $code  $base"
          done

      # release APK 由 build.gradle.kts 的 env 驱动 signingConfig 直接签名产出（不再走 debug 兜底）。
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 廉价校验：release APK 必须由正式 keystore 签名。未签名（app-release-unsigned.apk）
      # 或误用 debug 签名的产物一律判失败，绝不把不能安装的包发出去。
      - name: Verify release APK signature
        working-directory: android
        run: |
          set -euo pipefail
          out="app/build/outputs/apk/release"
          apk="$out/app-release.apk"
          [ -f "$apk" ] || apk="$out/app-release-unsigned.apk"
          [ -f "$apk" ] || { echo "❌ 未生成 release APK（$out 下没有 app-release*.apk）"; exit 1; }
          case "$apk" in
            *unsigned*) echo "❌ release APK 未签名（$apk）：请配置 ANDROID_KEYSTORE_* secrets 后重试。"; exit 1;;
          esac
          echo "校验 $apk 的签名证书："
          certs="$(apksigner verify --print-certs "$apk")"
          echo "$certs"
          if echo "$certs" | grep -qi 'android debug'; then
            echo "❌ release APK 使用的是 debug 签名，不能作为正式产物发布。"; exit 1
          fi
          echo "✅ release APK 已用正式密钥签名"

      - name: Resolve version label
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          v="${{ steps.ver.outputs.value }}"
          rel="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$rel" ] || { echo "❌ 没有已签名的 release APK，终止发布（绝不上传 debug/未签名产物）。"; exit 1; }
          cp "$rel" "dist-apk/pushbox-release-${v}.apk"
          ls -l dist-apk

      - name: Calculate mapping.txt checksum
        id: mapping_sha
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MAPPING_FILE="android/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            SHA256=$(sha256sum "$MAPPING_FILE" | cut -d' ' -f1)
            echo "value=$SHA256" >> "$GITHUB_OUTPUT"
            echo "mapping.txt SHA256: $SHA256"
          else
            echo "value=未生成" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive mapping.txt (retrace 用)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          # 缺 mapping 不该拖垮整条发布：没有 minify 的构建就没有这个文件。
          if-no-files-found: warn
          # 不写 retention-days：upload-artifact 的声明上限是 90 天，公开仓也是 90 天封顶，
          # 写 400 只会被判非法输入而把步骤跑红。要长期留存得走"加密后作 Release 资产"。

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MAPPING_SHA256: ${{ steps.mapping_sha.outputs.value }}
        run: |
          set -uo pipefail
          # 两个构建工作流可能在同一 tag 上并发建 release：create 撞已存在就吞掉，
          # 资产用 --clobber 覆盖上传，保证并发安全。
          gh release create "$TAG" --target "$SHA" --title "PushBox $TAG" \
            --notes "自动构建产物：Android APK / Windows 安装包 / Docker 镜像 iamplusdev/push-box:$TAG
        
          ## Mapping File（用于还原线上崩溃堆栈）
          - 归档：本 tag 对应 workflow run 的 artifact \`mapping-${TAG}\`（需要仓库读权限，不进公开 Release）
          - SHA256: ${MAPPING_SHA256:-未计算}
          - 工具：\$ANDROID_HOME/cmdline-tools/latest/bin/retrace mapping.txt crash_stacktrace.txt" \
            --verify-tag 2>/dev/null || true
          shopt -s nullglob
          gh release upload "$TAG" dist-apk/*.apk --clobber
