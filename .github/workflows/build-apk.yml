name: Build Android APK

# 三条发布链是解耦的：本文件只认 android-v* 与旧的 v*（三端一起发）两种标签。
# 只改服务端时打 server-v*，这里根本不会被触发；main 上的日常构建也只在 android/ 真的变了时跑。
# 打 android-vX.Y.Z 时发布到 GitHub Release，文件名为 pushbox-release-X.Y.Z.apk；
# 打 vX.Y.Z 时仍按"三端一起发"的老口径发布。
#
# 需要配的 Secrets（release 必须签名：未配置或误用 debug 签名一律判失败，不再回退 debug）：
#   ANDROID_KEYSTORE_BASE64   release keystore 的 base64，要求"一整行标准字母表"：
#                             Linux/macOS  base64 -w0 android/dev/pushbox-release.jks
#                             PowerShell   [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\dev\pushbox-release.jks"))
#                             写入用  gh secret set ANDROID_KEYSTORE_BASE64 --body "$(base64 -w0 android/dev/pushbox-release.jks)"
#                             不能是 certutil -encode 那种带 -----BEGIN/END----- 包头的产物，也不能是 base64url（含 -/_）；
#                             2026-10-20 那次 run 39375007556 就是红在这里，报的是一句看不出所以然的
#                             "Illegal base64 character 2d"（2d = '-'）。现在 app/build.gradle.kts 会把
#                             看到的形状（长度 / 有无 PEM 包头 / 有无换行）报出来再失败，不打印内容。
#   ANDROID_KEYSTORE_PASSWORD keystore 口令
#   ANDROID_KEY_ALIAS         别名
#   ANDROID_KEY_PASSWORD      私钥口令（多数与 keystore 口令相同）
# 标签事件不带 paths 过滤（否则 tag 指到的提交恰好没碰 android/ 时会静默不发布）；
# main 事件按 paths 过滤，改服务端或文档不会顺带重打一个 APK。
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      # :pbcore 直接编译 ../packages/core 的同一份源码，core 动了 APK 必须跟着重出
      - "packages/core/**"
      - "scripts/set-version.sh"
      - ".github/workflows/build-apk.yml"
    tags: ["android-v*", "v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag 事件里 gh release 建/传资产用；main 事件用不到但不影响

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接写进步骤 if，映射到 env 再用 env.* 判空。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 同 ci.yml 的 android job：不用 android-actions/setup-android@v3（它要装已下架的 legacy `tools` 包，
      # 2026-10-20 那次红就是它造成的），改用 runner 预装 SDK + 一次入镜检查。
      # apksigner 来自 $ANDROID_HOME/build-tools/<最新版>，下一步把它挂进 PATH，所以这里必须确认 build-tools 非空。
      - name: 核对 runner 预装的 Android SDK
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::runner 没导出 ANDROID_HOME，本步依赖的预装 SDK 前提变了"; exit 1; }
          CS=$(grep -m1 -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+' || true)
          [ -n "$CS" ] || { echo "::error::没能从 android/app/build.gradle.kts 读出 compileSdk"; exit 1; }
          [ -d "$ANDROID_HOME/platforms/android-$CS" ] || { echo "::error::缺 platforms/android-$CS（compileSdk=$CS）"; exit 1; }
          [ -n "$(ls -A "$ANDROID_HOME/build-tools" 2>/dev/null)" ] || { echo "::error::缺 build-tools（apksigner 无处可取）"; exit 1; }
          echo "✅ compileSdk=$CS 在位；build-tools：$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      # 统一版本号注入（标签取 android-vX.Y.Z / vX.Y.Z 的 X.Y.Z；分支事件用 0.1.0-<run> 只为出测试包）
      - name: Set version from git tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME##*-v}"   # android-v1.2.0 / v1.2.0 -> 1.2.0
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Inject version into Android build
        run: |
          # 正式 tag（X.Y.Z）才注入；main/dispatch 的 0.1.0-<run> 非正式版本脚本会判失败，
          # 这里容忍并沿用已提交默认，保证 main 每次都能产出可下载 artifact。
          # --only=android：解耦之后这里不碰服务端与 Windows 的版本号。
          bash scripts/set-version.sh --only=android "${{ steps.version.outputs.version }}" \
            || echo "⚠️ 非正式版本（${{ steps.version.outputs.version }}）跳过注入，沿用已提交 versionCode/versionName。"

      - name: Put build-tools on PATH (for apksigner)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # release APK 由 build.gradle.kts 的 env 驱动 signingConfig 直接签名产出（不再走 debug 兜底）。
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 廉价校验：release APK 必须由正式 keystore 签名。未签名（app-release-unsigned.apk）
      # 或误用 debug 签名的产物一律判失败，绝不把不能安装的包发出去。
      # 指纹基线在 android/release-cert.sha256（发布检查清单 的"签名证书与上一版一致"引用同一串）。
      # 换 key 是有意的破坏性动作：老用户必须卸载重装、历史消息全丢，所以真要改那一串，
      # 先把这件事写进 CHANGELOG 再改文件，别让它静默跟着 secrets 一起换掉。
      - name: Verify release APK signature
        working-directory: android
        run: |
          set -euo pipefail
          out="app/build/outputs/apk/release"
          apk="$out/app-release.apk"
          [ -f "$apk" ] || apk="$out/app-release-unsigned.apk"
          [ -f "$apk" ] || { echo "❌ 未生成 release APK（$out 下没有 app-release*.apk）"; exit 1; }
          case "$apk" in
            *unsigned*) echo "❌ release APK 未签名（$apk）：请配置 ANDROID_KEYSTORE_* secrets 后重试。"; exit 1;;
          esac
          echo "校验 $apk 的签名证书："
          certs="$(apksigner verify --print-certs "$apk")"
          echo "$certs"
          if echo "$certs" | grep -qi 'android debug'; then
            echo "❌ release APK 使用的是 debug 签名，不能作为正式产物发布。"; exit 1
          fi
          [ -f release-cert.sha256 ] || { echo "❌ 缺 android/release-cert.sha256，没法核对证书指纹"; exit 1; }
          expected="$(tr -d '[:space:]' < release-cert.sha256)"
          echo "$expected" | grep -qE '^[0-9a-f]{64}$' || {
            echo "❌ release-cert.sha256 不是 64 位小写十六进制（读到：$expected）"; exit 1; }
          # 取每一个 signer 的 SHA-256：多 signer 时逐条核，缺基线的那一条也算红。
          # 锚 `certificate SHA-256 digest:` 整串——--verbose 还会打 public key SHA-256，那是另一个数。
          digests="$(echo "$certs" | tr -d '\r' | sed -n 's/.*certificate SHA-256 digest: *//p' | tr 'A-F' 'a-f')"
          [ -n "$digests" ] || { echo "❌ apksigner 没打印出任何证书 SHA-256，判据本身坏了"; exit 1; }
          echo "$digests" | grep -qx "$expected" || {
            echo "❌ 签名证书与基线不符，这等于换 key：老用户要卸载重装、历史消息全丢。"
            echo "   基线（release-cert.sha256）：$expected"
            echo "   这份 APK 实际用的："
            echo "$digests" | sed 's/^/     /'
            exit 1; }
          echo "✅ release APK 已用正式密钥签名，且证书指纹与基线一致（$expected）"

      - name: Resolve version label
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # 文件名只带版本号，不带 android-v 前缀：android-v1.2.0 -> pushbox-release-1.2.0.apk
            echo "value=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          v="${{ steps.ver.outputs.value }}"
          rel="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$rel" ] || { echo "❌ 没有已签名的 release APK，终止发布（绝不上传 debug/未签名产物）。"; exit 1; }
          cp "$rel" "dist-apk/pushbox-release-${v}.apk"
          ls -l dist-apk

      - name: Calculate mapping.txt checksum
        id: mapping_sha
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MAPPING_FILE="android/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            SHA256=$(sha256sum "$MAPPING_FILE" | cut -d' ' -f1)
            echo "value=$SHA256" >> "$GITHUB_OUTPUT"
            echo "mapping.txt SHA256: $SHA256"
          else
            echo "value=未生成" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive mapping.txt (retrace 用)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          # 缺 mapping 不该拖垮整条发布：没有 minify 的构建就没有这个文件。
          if-no-files-found: warn
          # 不写 retention-days：upload-artifact 的声明上限是 90 天，公开仓也是 90 天封顶，
          # 写 400 只会被判非法输入而把步骤跑红。要长期留存得走"加密后作 Release 资产"。

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MAPPING_SHA256: ${{ steps.mapping_sha.outputs.value }}
          CERT_B64: ${{ secrets.CODESIGN_CERT_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          # 组件标签（android-vX.Y.Z）只发 APK，标题写清这一页是什么；旧的 vX.Y.Z 仍是三端一起发，
          # 标题与正文沿用原样。镜像标签由 docker-publish.yml 的闸门从 pom 现读（1.1.2 / 1.1 / latest），
          # 与 git tag 不同名，所以不能照抄 $TAG，否则用户会去拉一个 Hub 上不存在的标签。
          IMG_TAG="${VERSION}"
          NOTE="自动构建产物：Android APK v${VERSION}（签名证书与仓库基线一致）
          - 文件：\`pushbox-release-${VERSION}.apk\`
          - 安装：下载后直接安装；覆盖安装保留历史消息"
          if [[ "$TAG" == v* ]]; then
            NOTE="自动构建产物：Android APK / Windows 安装包 / Docker 镜像 iamplusdev/push-box:${IMG_TAG}（同一镜像另有 ${IMG_TAG%.*} 与 latest 两个标签）"
          fi
          NOTE="$NOTE

          ## Mapping File（用于还原线上崩溃堆栈）
          - 归档：本 tag 对应 workflow run 的 artifact \`mapping-${TAG}\`（需要仓库读权限，不进公开 Release）
          - SHA256: ${MAPPING_SHA256:-未计算}
          - 工具：\$ANDROID_HOME/cmdline-tools/latest/bin/retrace mapping.txt crash_stacktrace.txt"
          # setup.exe 是 build-msi.yml 传的，但它签没签名只看仓库配没配这对证书——这个信号两个
          # workflow 都读得到，所以两边写同一句：谁抢到 create 都不会把这一句弄丢。
          if [ -z "${CERT_B64:-}" ]; then
            NOTE="$NOTE

          **Windows 安装包未签名**（仓库没配 CODESIGN_CERT_BASE64）：首次运行 setup.exe 时 Windows 会弹一层「Windows 保护了你的电脑」，点「更多信息」→「仍要运行」即可继续安装。配置代码签名证书后这一段自动消失，见 docs/代码签名指南.md。"
          fi
          TITLE="PushBox Android v${VERSION}"
          if [[ "$TAG" == v* ]]; then TITLE="PushBox $TAG"; fi
          gh release create "$TAG" --target "$SHA" --title "$TITLE" --notes "$NOTE" --verify-tag 2>/dev/null || true
          shopt -s nullglob
          gh release upload "$TAG" dist-apk/*.apk --clobber
