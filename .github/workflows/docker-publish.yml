name: Build and Push Docker Image

# 服务端镜像 = Spring Boot API + 烘进去的 Web 管理台（apps/web-admin/dist），同源、默认端口 7404。
# 构建上下文必须是仓库根（Dockerfile 要 packages/core/ + apps/server/ + apps/web-admin/ + 根 pom.xml），dockerfile 用 infra/Dockerfile。
# Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（access token，不是登录密码）。
# 质量闸就是"镜像能编出来"：多阶段里 mvn package 会编译 core+server、npm run build 会 tsc 前端。
# 这里**不跑测试**：服务端那套要连真库真桶，已由 `ci.yml` 用 service container 跑并断言"闸门用例一条没被跳过"；
# 在两个 workflow 里各跑一遍只会让同一个红出现两次，而推送这条的判据本来就不是测试。
# 三条发布链是解耦的：本文件只认 server-v* 与旧的 v*（三端一起发）两种标签。
# 只改服务端时打 server-v*，Android 与 Windows 两条流水线根本不会被触发。
# **推 main 不构建镜像**：镜像能不能编由 ci.yml 的服务端 job 判，这条链只在打标签时往 Hub 真推东西。
# tag 事件不带 paths 过滤（否则 tag 指到的提交恰好没碰这些目录时会静默不发布）。
#
# 版本号的唯一来源是**仓库里已提交的那份**（`pom.xml`，由 `scripts/set-version.sh --only=server` 写全），
# workflow 不再现场改写它。旧写法在 tag 事件上跑 `set-version.sh "${GITHUB_REF_NAME#v}"`，于是"tag 说 1.2.3、
# pom 说 1.1.0"也能构建成功：推上去的是一个自称 1.2.3、里面跑的却是 1.1.0 的镜像，而 Docker Hub 推出去收不回来——
# 被人拉走的那份 manifest 就是错的。现在这种不一致在构建之前就被下面那道闸门拦红。
# Hub 上**只有版本标签**：tag 事件（server-v1.1.2 / v1.1.2）出 `1.1.2` / `1.1` / `latest`，别的一个不出。
# 2026-10-23 起去掉了 `main` 与 `sha-<7位>`：一个每次合并都要移动的分支标签，换来的只是"能拉到最新合并"，
# 而"回滚到上一版"靠的是历史版本标签（`1.1.5`、`1.1.4`… 都留在 Hub 上且不可变），不需要浮动标签兜底。
# 在**分支**上手动 dispatch 只构建不推（判据在下面 push 那道闸），要重出某个版本就在**那个 tag 上** dispatch。
# 版本标签的不可变性是这套口径的底：`1.1.0` 如果被每次合并都覆盖一次，钉着它的人今天和上周拉到的
# 就不是同一个镜像，"回滚到 1.1.0"这件事就不存在了。
on:
  push:
    tags: ["server-v*", "v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建、不推 Docker Hub（在 tag 上 dispatch 时用来核对标签清单；在分支上 dispatch 本来就不推）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE: docker.io/iamplusdev/push-box

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 早于任何构建/推送先校验凭据，缺 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN 立刻失败并给出清晰原因，
      # 避免在跑完 mvn/npm 后才在登录步骤红掉。
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::缺少 DOCKERHUB_USERNAME 或 DOCKERHUB_TOKEN，无法登录/推送镜像。请在仓库 Settings→Secrets 配置后重试。"
            exit 1
          fi
          echo "✅ Docker Hub 凭据已配置"

      # 版本一致性闸门：tag 说的版本、pom 写的版本、compose 钉的标签必须是同一个值，且都从仓库现读。
      # 放在 buildx 与 login 之前——这三样里任何一样不对，都不该有一个字节被推出去。
      - name: 版本号一致性闸门
        id: version
        env:
          # 判"这次是不是要发某个版本"用 github.ref 的前缀，不用 GITHUB_REF_TYPE / github.ref_type：
          # 后者在"于 tag 上点 workflow_dispatch"这种场景下到底是什么语义，本仓没有实测过，
          # 而下面 push 那道闸要拿它当唯一依据——语义猜错就是"该推的没推"。refs/tags/ 前缀是看得见的字面量。
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF#refs/tags/}" != "${REF}" ]; then IS_TAG=true; else IS_TAG=false; fi
          # 两条取值都要接 `|| true`：grep 没匹配上时退出码非 0，会被上面的 set -e 直接掐掉这一步，
          # 于是下面那两条错误说明永远打印不出来——闸门红了却没人知道为什么红。
          # pom 这条要连标签尖括号一起锚定：只写 grep -oE '[0-9]+\.[0-9]+\.[0-9]+' 的话，
          # 1.1.0-SNAPSHOT 也会被读成 1.1.0，闸门就成了假绿。本仓全仓零 SNAPSHOT，所以直接判死；
          # 哪天改成 SNAPSHOT 开发版，这条要在分支事件上容忍后缀，别把闸门删掉。
          POM_VERSION=$(grep -m1 -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' pom.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          COMPOSE_TAG=$(grep -m1 -E 'image: docker\.io/iamplusdev/push-box:' infra/docker-compose.yml | sed -E 's#^.*:##' || true)
          echo "ref=${REF} (${IS_TAG}) pom=${POM_VERSION} compose=${COMPOSE_TAG}"
          if [ -z "${POM_VERSION}" ]; then
            echo "::error::没从 pom.xml 读出 X.Y.Z 版本号（pom 写法变了就改这条判据的取值方式，别把它删了）"
            exit 1
          fi
          if [ -z "${COMPOSE_TAG}" ]; then
            echo "::error::没在 infra/docker-compose.yml 找到 image: docker.io/iamplusdev/push-box:<tag>——照 compose 起的人不知道该拉哪一版"
            exit 1
          fi
          if [ "${IS_TAG}" = "true" ]; then
            # server-v1.2.3 与旧的 v1.2.3 都取 X.Y.Z
            TAG_VERSION="${REF_NAME##*-v}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
              echo "::error::tag 是 ${REF_NAME}（版本 ${TAG_VERSION}），pom.xml 写的却是 ${POM_VERSION}。先 bash scripts/set-version.sh --only=server ${TAG_VERSION} 并提交，再重新打这个 tag。不能推一个自称 ${TAG_VERSION}、里面跑着 ${POM_VERSION} 的镜像——推送不可逆，被人拉走的那份 manifest 永远错着"
              exit 1
            fi
            if [ "${COMPOSE_TAG}" != "${POM_VERSION}" ]; then
              echo "::error::compose 钉的是 :${COMPOSE_TAG}，本次推的是 :${POM_VERSION}；照 compose 起的人拉不到刚发的这一版"
              exit 1
            fi
          fi
          echo "version=${POM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${POM_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ 版本口径一致：${POM_VERSION}"

      # 只有 tag 才可能真推 Hub，且 tag 上勾了 dry_run 也只构建。
      # 分支 dispatch 永远不推：它的用途是"验 DOCKERHUB_* 能不能登录、这份 Dockerfile 还编不编得出来"。
      # 注意 push=false 时下面仍需要一个标签给 buildx 当导出目标（没有 export target 时 buildx 直接失败），
      # 所以 metadata 里配了一条只在非 tag 上启用的占位标签，它只活在 runner 本地。
      - name: 本次是否真推 Docker Hub
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          IS_TAG: ${{ steps.version.outputs.is_tag }}
        run: |
          set -euo pipefail
          if [ "${IS_TAG}" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::非 tag 触发（${EVENT_NAME} ${GITHUB_REF_NAME}）：只构建，Hub 上不会多任何东西"
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry-run：只构建，不推 Docker Hub。下面打印的标签本次不会真的写进仓库"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "✅ 本次会真的推送（${EVENT_NAME} → tag）"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 只有 tag（server-v1.2.3 / v1.2.3，含在这个 tag 上手动 dispatch）才出标签：X.Y.Z / X.Y / latest。
            # 不用 type=semver：它只认 vX.Y.Z 这种裸 semver，组件前缀（server-v）会被整个忽略；
            # 版本值由上一道闸门从 pom 现读，这里直接引用它的输出。
            # 分支与分支 dispatch 不再产 main / sha-<短>——Hub 上只留版本标签，见文件头那段。
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_tag == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.is_tag == 'true' }}
            # latest 只给 tag。能走到这里的 tag 已经过了"版本 = pom 的严格 X.Y.Z"那道闸，
            # 所以不存在把 latest 指向预发布版本的风险。
            type=raw,value=latest,enable=${{ steps.version.outputs.is_tag == 'true' }}
            # 非 tag 时上面三条全关，而 push=false 仍要有一个导出目标（buildx 没有 tag 会直接失败），
            # 所以给一个只存在于 runner 本地的占位标签。它永远不会到 Hub：push 那道闸已经先判了 false。
            type=raw,value=dispatch-${{ github.run_number }},enable=${{ steps.version.outputs.is_tag != 'true' }}
          labels: |
            # 版本号还要打进镜像本身：`docker image inspect` 读得到，不用靠标签名猜自己跑的是哪一版。
            # metadata 自己的 org.opencontainers.image.version 在 tag 事件上取 git tag 名、
            # 在分支事件上取成分支名，所以统一由上面那道闸门从 pom 现读一个值盖掉它。
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ steps.gate.outputs.push }}
          load: ${{ steps.gate.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 层缓存：源码没动的阶段（如 node 依赖层）下次复用。
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # 留痕用：发布后核对 Docker Hub 上的实际标签，就拿这一行对（Hub 的 tags API 匿名可读）。
      - name: 本次的标签清单
        env:
          PUSH_MODE: ${{ steps.gate.outputs.push }}
        run: |
          echo "push=${PUSH_MODE} version=${{ steps.version.outputs.version }}"
          echo "${{ steps.meta.outputs.tags }}"

