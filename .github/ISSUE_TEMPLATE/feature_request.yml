name: 功能建议
description: 新功能或改进
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 先说场景和现在的手动绕法，再说功能。"我想要 X 按钮"这种描述很难判断值不值得做。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 涉及端
      options: [服务端, Android 客户端, Windows 客户端, Web 管理台, 部署/运维, 跨端]
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 与现有设计口径的冲突（先自查，能少走弯路）
      description: 详见 README「信任边界」与 docs/软件设计方案.md §1
      options:
        - label: 我不需要端到端加密（方案里已否决，代价是服务端不能搜索/摘要/抓图）
          required: false
        - label: 我不需要"消息自动过期/定时清理"（当前设计是永久保留，容量治理靠报表 + 手动清理）
          required: false
        - label: 我不需要把投递单位从"设备"改成"Space"（同一 device_id 的新连接会顶掉旧的）
          required: false
        - label: 我不要求端上消息正文加密（那会破坏全文搜索）
          required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括"用别的项目/别的手动流程"
