name: 缺陷报告
description: 服务端 / Android / Windows / Web 管理台 / 部署的问题
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先确认两件事，能省掉一轮往返：
        1. `/healthz` 的 `storage` 只校验"配置项非空"，**既不探端点可达也不探桶是否存在**。
           报"存储相关"问题请用 `mc ls` 或 `aws s3api head-bucket` 判桶（命令见 deploy/QUICK-START.md「桶要建一次」），别拿 `/healthz` 当证据。
        2. 服务端库里是明文、端上正文不加密，这是设计取舍（见 SECURITY.md），不是缺陷。
  - type: dropdown
    id: surface
    attributes:
      label: 出问题的端
      options: [服务端, Android 客户端, Windows 客户端, Web 管理台, 部署（compose/Caddy/备份）, CI/CD]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 服务端看 Docker 镜像 tag 或 GitHub Release；Android 看「关于」页 versionName；Windows 看「关于」页
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: topology
    attributes:
      label: 部署拓扑
      description: 存储用 s3 还是 local（`PB_STORAGE_TYPE`）、对象存储是哪台、服务端是否在容器里
      placeholder: "PB_STORAGE_TYPE=s3，RustFS 同机 docker 网络内，服务端在容器里"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 带图消息请给出消息在 messages 表里的最终状态（failed / pending）与 sender_id
      value: |
        1. 
        2. 
        3. 
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      description: |
        贴之前自己过一遍眼：**不要贴 `recovery`、token、`BEGIN PRIVATE`、库口令、桶密钥**。
        服务端日志里出现键值明文本身就是缺陷，可以单独报。
      value: |
        ```
        ```
  - type: checkboxes
    id: searched
    attributes:
      label: 已确认
      options:
        - label: 已按 QUICK-START「桶要建一次」确认桶存在（`mc ls` 或 `aws s3api head-bucket`，不是 `/healthz`）
          required: false
        - label: 已确认端口跟着拓扑走（RustFS 镜像听 9000/9001，远端实例可能挂在别的端口）
          required: false
        - label: 已在 issue 列表里搜过同类问题
          required: true
